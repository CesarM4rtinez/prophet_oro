# Robot Supertrend 10/3 (1h) para GOLD en Capital.com — ver robot_supertrend/README.md
name: Robot Supertrend GOLD (Capital.com)

# Disparadores:
# 1. PRINCIPAL: cron-job.org llama cada 5 min a la API de GitHub (workflow_dispatch con
#    dry_run=false). GitHub atiende esas llamadas al momento; su horario interno no (el 25/11
#    corrio 2 veces en 8 h). Pasos en robot_supertrend/README.md, seccion "GitHub Actions".
# 2. RESPALDO: el cron de GitHub de abajo, por si el servicio externo falla.
# El robot es seguro de repetir (velas 1h cerradas + estado leido de Capital.com) y no
# corre dos copias a la vez (concurrency). Si usas runner.py en una PC, apaga este flujo
# con BOT_ENABLED=false para no operar dos veces.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulacion: calcula la señal sin enviar ordenes"
        type: boolean
        default: true

concurrency:
  group: robot-supertrend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    # Interruptor general: Settings → Secrets and variables → Actions → Variables → BOT_ENABLED = true
    if: vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r robot_supertrend/requirements.txt
      # Memoria de los frenos (capital al inicio del dia, maximo, pausa por caida): se
      # guarda en la cache de GitHub al final de cada ejecucion y se recupera en la siguiente.
      - name: Recuperar estado de los frenos
        uses: actions/cache/restore@v4
        with:
          path: robot_supertrend/robot_state.json
          key: robot-state-${{ github.run_id }}
          restore-keys: robot-state-
      - name: Ejecutar robot
        run: python robot_supertrend/bot.py
        env:
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          BOT_STATE_FILE: robot_supertrend/robot_state.json
          BOT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || (vars.BOT_DRY_RUN || 'false') }}
          CAPITAL_ENV: ${{ vars.CAPITAL_ENV || 'DEMO' }}
          BOT_ALLOW_LIVE: ${{ vars.BOT_ALLOW_LIVE || 'false' }}
          CAPITAL_ACCOUNT_NAME: ${{ vars.CAPITAL_ACCOUNT_NAME || 'dm' }}  # subcuenta demo elegida por el usuario
          BOT_EPIC: ${{ vars.BOT_EPIC || 'GOLD' }}
          BOT_SIZE: ${{ vars.BOT_SIZE || '0.1' }}
          BOT_RESOLUTION: ${{ vars.BOT_RESOLUTION || 'HOUR' }}
          ST_PERIOD: ${{ vars.ST_PERIOD || '10' }}
          ST_FACTOR: ${{ vars.ST_FACTOR || '3' }}
          BOT_MAX_SIGNAL_AGE: ${{ vars.BOT_MAX_SIGNAL_AGE || '2' }}   # solo entra en las 2 velas siguientes al cambio de color
          BOT_EMERGENCY_STOP_ATR: ${{ vars.BOT_EMERGENCY_STOP_ATR || '1.0' }}
          BOT_SIZING: ${{ vars.BOT_SIZING || 'risk' }}
          RISK_TOTAL_PCT: ${{ vars.RISK_TOTAL_PCT || '1.5' }}
          RISK_ADD_EVERY_ATR: ${{ vars.RISK_ADD_EVERY_ATR || '1.0' }}
          RISK_MAX_UNITS: ${{ vars.RISK_MAX_UNITS || '' }}
          NEWS_FILTER: ${{ vars.NEWS_FILTER || 'true' }}
          NEWS_MINUTES_BEFORE: ${{ vars.NEWS_MINUTES_BEFORE || '30' }}
          NEWS_MINUTES_AFTER: ${{ vars.NEWS_MINUTES_AFTER || '45' }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
      - name: Guardar estado de los frenos
        if: always() && hashFiles('robot_supertrend/robot_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: robot_supertrend/robot_state.json
          key: robot-state-${{ github.run_id }}-${{ github.run_attempt }}
